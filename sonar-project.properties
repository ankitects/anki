sonar.projectKey=ankitects_anki
sonar.organization=ankitects
sonar.projectVersion=0.1
sonar.host.url=https://sonarcloud.io
sonar.qualitygate.wait=false

# Fork code is data, never executable input to build tools in the scanner job.
# Clippy runs in the unprivileged CI; SCA can also invoke build tools.
sonar.rust.clippy.enable=false
sonar.sca.enabled=false

sonar.sources=pylib/anki,qt/aqt,qt/tools,ts,rslib,tools
sonar.tests=pylib/tests,qt/tests,tools/tests
# Test files nested under a source directory must not be indexed as sources.
sonar.exclusions=out/**,target/**,node_modules/**,**/generated/**,**/*.sql,extra/**,tools/tests/**

sonar.python.version=3.10
sonar.python.coverage.reportPaths=\
    out/coverage/python-pylib/coverage.xml,\
    out/coverage/python-qt/coverage.xml

sonar.javascript.lcov.reportPaths=out/coverage/typescript/lcov.info

sonar.rust.lcov.reportPaths=out/coverage/rust/lcov.info
sonar.rust.clippyReport.reportPaths=out/coverage/rust/clippy.json

# Generated by the trusted preparation helper, without PR-supplied extends/plugins.
sonar.typescript.tsconfigPaths=tsconfig.sonar.json
