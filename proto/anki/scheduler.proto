message RwkvPrepareOfflineRequest {
  // The RWKV model file. The weights are not part of the backend: the app
  // passes a file the user supplied. Give each model file its own path (for
  // example named by its hash); a file replaced in place under a known path
  // is refused until the process restarts, because the loaded engine and the
  // saved state belong to the old model.
  string model_path = 1;
  // How card/note states are kept: "f32", "int8" or "int4"; empty: int8 (the
  // fork's desktop default).
  string state_precision = 2;
  // "sm72" enables the input rules used by the leak-free checkpoints (SM72
  // and the fork's build 115 family: every Big, Small and Tiny model).
  // Empty retains the original automatic big/small model behavior.
  string model_kind = 3;
  // kuma3: the model size's Instant model, beside `model_path` (its two-head
  // model). Empty: `model_path` alone, as before. With it, the backend runs
  // what the desktop runs for the presets' schedulers: both models for
  // RWKV-Instant and RWKV-Curve, the Instant model alone for RWKV-Instant
  // without RWKV-Curve, the two-head model alone otherwise.
  string instant_model_path = 4;
  // "Use one model for RWKV": the two-head model alone even when presets use
  // both schedulers.
  bool single_model = 5;
}

message RwkvPrepareOfflineResponse {
  // Reviews being replayed (an estimate when built in the background): the
  // app's "Rebuilding RWKV" toast and its rebuild notification.
  uint64 reviews_replayed = 1;
}

message RwkvOfflineInstantPassStepRequest {
  // "Rebuild RWKV State": throw the model state away and replay the whole
  // review history first.
  bool restart = 1;
  // Only report the state (after absorbing new reviews); never rebuilds.
  bool status_only = 2;
}

message RwkvOfflineInstantPassProgress {
  // False until RwkvPrepareOffline has succeeded on this collection.
  bool available = 1;
  // Cards scored by this call.
  uint32 scored = 2;
  // How long this call took.
  uint64 step_micros = 3;
  // The size of the review history the model state holds.
  uint64 reviews_absorbed = 4;
  // Reviews this call replayed (all of them after a restart).
  uint64 reviews_replayed = 5;
  // While not available: the background replay's progress (reviews done of
  // total; total 0 when none is under way), for the app's progress bar.
  uint64 replay_done = 6;
  uint64 replay_total = 7;
}

message RwkvOfflineCalibrationRequest {
  repeated int64 review_ids = 1;
  // Record the whole history, not only its newest 30% (for FSRS's
  // validation folds, which cover most of it).
  bool all_reviews = 2;
  // Only report: never start the replay that records them.
  bool check_only = 3;
}

message RwkvOfflineCalibrationResponse {
  // The data is there (the asked-for answers it has are below).
  bool available = 1;
  // The answers among those asked for that it has (the newest 30% of the
  // history at its replay, or all of it, and every answer since), and RWKV's
  // predictions.
  repeated int64 review_ids = 2;
  repeated float predictions = 3;
  // Being recorded by a replay in the background (started: by this call).
  bool computing = 4;
  bool started = 5;
  uint64 replay_done = 6;
  uint64 replay_total = 7;
}

message RwkvOfflineWorkloadResultResponse {
  // False while the simulation runs.
  bool done = 1;
  // Why there is no result (it failed, was cancelled or never started).
  string error = 2;
  // A SimulateFsrsWorkloadResponse, or with rwkv_comparison a
  // RwkvComparisonResponse.
  bytes result = 3;
}

message RwkvOfflineForecastRequest {
  // Cards to forecast; empty = every review card
  // ("is:review -is:learn -is:suspended -is:buried").
  string search = 1;
  // Seconds from now; a negative value means the next day rollover.
  repeated int64 offsets_secs = 2;
}

message RwkvOfflineForecastResponse {
  message Card {
    int64 card_id = 1;
    // The card's home deck.
    int64 deck_id = 2;
    // The recall the card is due under.
    float target_retention = 3;
    // One per requested offset.
    repeated float recall = 4;
    // Not due, but in today's reviews to reach "minimum reviews per day"
    // (the cards the deck list adds for it).
    bool minimum_today = 5;
    // Below its target, but the deck list does not count it yet: it waits for
    // the repeat spacing ("minimum intervening reviews", same-day rules).
    bool waiting = 6;
  }
  // False until RwkvPrepareOffline has succeeded on this collection.
  bool available = 1;
  repeated Card cards = 2;
  // At the next rollover (when a negative offset was asked for): the due
  // cards plus what "minimum reviews per day" adds then, as the deck list
  // would count them if you stop reviewing now.
  optional uint32 rollover_with_minimum = 4;
}

