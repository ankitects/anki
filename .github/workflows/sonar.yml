name: SonarCloud

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: sonar-${{ github.event.workflow_run.head_repository.id }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  sonar:
    name: SonarCloud Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && (github.event.workflow_run.event == 'push'
          || github.event.workflow_run.event == 'pull_request')
    steps:
      # workflow_run uses the default branch. Pin the helper/config to the same
      # trusted commit as this workflow, never to the PR's version.
      - name: Checkout trusted tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v4
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 #v4

      # Download ZIPs as bytes, not into the checkout. The trusted helper accepts
      # only expected regular files and validates the PR via GitHub's API.
      - name: Validate CI context and download reports
        id: context
        run: just --justfile trusted/justfile sonar-context
        env:
          GH_TOKEN: ${{ github.token }}

      # Explicit opt-in: this checkout is NEVER built, installed, tested, or used
      # as tooling. Only selected regular source files enter the scan snapshot.
      # See docs/sonarcloud.md before changing this trust boundary.
      - name: Checkout analysis revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ steps.context.outputs.ref }}
          path: source
          fetch-depth: 0
          persist-credentials: false
          allow-unsafe-pr-checkout: true

      - name: Prepare data-only scan snapshot
        run: just --justfile trusted/justfile sonar-prepare

      # No CI caches, PR scripts, package installs, or automatic Clippy/SCA.
      # The token is supplied only here; all settings and paths are trusted.
      # Quality Gate results are informative: keep Sonar out of required checks.
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@713881670b6b3676cda39549040e2d88c70d582e #v8.2.0
        with:
          projectBaseDir: scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
          SONAR_USER_HOME: ${{ runner.temp }}/sonar-user-home
