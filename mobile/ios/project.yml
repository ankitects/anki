name: BrainliftMobile
options:
  bundleIdPrefix: com.techmexdev
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  SwiftProtobuf:
    url: https://github.com/apple/swift-protobuf.git
    exactVersion: 1.38.1
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
targets:
  BrainliftMobile:
    type: application
    platform: iOS
    info:
      path: BrainliftMobile/App/Info.plist
      properties:
        AnkiCoreCommit: af5417a858cf979e4f9cadef02310d197fa52429
        CFBundleDisplayName: Brainlift
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    sources:
      - path: BrainliftMobile
    dependencies:
      - package: SwiftProtobuf
      - framework: ../../out/ios/AnkiBackend.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.techmexdev.BrainliftMobile
        SWIFT_OBJC_BRIDGING_HEADER: rust_bridge/include/anki_backend.h
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
  BrainliftMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BrainliftMobileTests
    dependencies:
      - target: BrainliftMobile
      - package: SwiftProtobuf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.techmexdev.BrainliftMobileTests
        GENERATE_INFOPLIST_FILE: "YES"
schemes:
  BrainliftMobile:
    build:
      targets:
        BrainliftMobile: all
        BrainliftMobileTests: [test]
    test:
      targets:
        - BrainliftMobileTests
