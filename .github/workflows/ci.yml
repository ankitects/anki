name: CI

# Caching strategy
#
# Each check job caches its build outputs (out/, which includes the cargo
# target dir at out/rust) under the key build-<platform>-<pr-number|main>-
# <run-id>. Cache entries are immutable, so the run-id suffix makes the
# primary key unique: every run restores the newest earlier entry through
# restore-keys and saves a fresh one. Entries are ~1 GB and the repository
# budget is 10 GB, so each save also prunes the entries it supersedes (see
# .github/actions/save-build-cache). The label-triggered platform jobs do
# not save caches on PRs; they restore from the main-branch entry instead.
# node_modules is cached separately, keyed on yarn.lock. cache-cleanup.yml
# deletes a PR's remaining caches when the PR closes.

on:
  workflow_dispatch:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  N2_OUTPUT_PROGRESS: "1"
  N2_OUTPUT_SUCCESS: "1"

jobs:
  minilints:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v4
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 #v1

      - name: Check for non-documentation changes
        id: non-doc-changes
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 #v47.0.6
        with:
          files: |
            **
          files_ignore: |
            **/*.md
            **/*.mdx
            docs/**/*.png
            docs/**/*.svg
            docs-site/**/*.png
            docs-site/**/*.jpg
            docs-site/**/*.svg
            docs-site/**/*.mp4

      - name: Run minilints
        if: steps.non-doc-changes.outputs.any_changed == 'true'
        run: cargo run -p minilints -- check /tmp/minilints.stamp
        env:
          CONTRIBUTORS_BYPASS_EMAILS: ${{ vars.CONTRIBUTORS_BYPASS_EMAILS }}

  # Lightweight formatting checks (no build outputs needed).
  # Uses individual tool installs instead of setup-anki to stay fast.
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 #v1
        with:
          cache: false # the shared cargo cache below covers this job

      # Restore-only: check-linux owns this cache. It provides a prebuilt n2
      # in ~/.cargo/bin, so the install step below is normally a no-op.
      - name: Restore cargo cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 #v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cargo/bin
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 #v7

      - name: Install n2
        run: command -v n2 || tools/install-n2
        env:
          RUSTFLAGS: "--cap-lints warn"

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 #v4

      - name: Run format checks
        run: just fmt

  # Linux runs on every PR and push to main.
  check-linux:
    runs-on: ubuntu-24.04
    name: check (linux)
    permissions:
      contents: read
      actions: write # cache pruning
      pull-requests: read # changed-files
      security-events: write # SARIF upload
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v4

      - name: Restore cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 #v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cargo/bin
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Restore build output cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 #v6.1.0
        with:
          path: out
          key: build-Linux-${{ github.event.pull_request.number || 'main' }}-${{ github.run_id }}
          restore-keys: |
            build-Linux-${{ github.event.pull_request.number || 'main' }}-
            build-Linux-main-
            build-Linux-

      - name: Restore node_modules cache
        id: node-modules-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 #v6.1.0
        with:
          path: out/node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('yarn.lock') }}
          restore-keys: node-modules-${{ runner.os }}-${{ runner.arch }}-

      - name: Setup build environment
        uses: ./.github/actions/setup-anki

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 #v4

      - name: Install cargo-llvm-cov, cargo-nextest and cargo-deny
        uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68 #v2.85.3
        with:
          tool: |
            cargo-llvm-cov@0.8.4
            cargo-nextest@0.9.99
            cargo-deny@0.20.2

      - name: Symlink node_modules
        run: ln -sf out/node_modules .

      - name: Restore coverage baseline
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 #v6.1.0
        with:
          path: out/coverage
          key: coverage-baseline-linux-${{ github.sha }}
          restore-keys: coverage-baseline-linux-

      - name: Move restored baseline aside
        if: github.event_name == 'pull_request'
        run: test -d out/coverage && mv out/coverage out/coverage-baseline || true

      - name: Build
        run: just build

      - name: Lint and test
        env:
          ONLINE_TESTS: "1"
        run: |
          just lint
          just test --coverage

      - name: Run complexipy diff
        id: complexipy
        continue-on-error: true
        run: |
          git fetch origin main:main 2>/dev/null || true
          just complexipy-diff

      - name: Upload SARIF results for complexipy
        if: steps.complexipy.outcome == 'failure'
        uses: github/codeql-action/upload-sarif@a6fd1787519fd23e68309fad43738e41a6ff2a9d #v4
        with:
            sarif_file: out/complexipy/complexipy-results.sarif
            category: complexipy

      - name: Cache coverage baseline
        if: github.ref_name == 'main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 #v6.1.0
        with:
          path: out/coverage
          key: coverage-baseline-linux-${{ github.sha }}

      # Every push to main saves a new baseline; keep only the newest two.
      - name: Prune old coverage baselines
        if: github.ref_name == 'main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/caches?key=coverage-baseline-linux-&sort=created_at&direction=desc&per_page=100" \
            --jq '.actions_caches[2:][].id' |
            while read -r id; do
              gh api -X DELETE "repos/${{ github.repository }}/actions/caches/$id" || true
            done

      - name: Check coverage regression
        if: github.event_name == 'pull_request'
        run: python3 tools/coverage/check-coverage-regression.py out/coverage-baseline out/coverage

      - name: Run e2e tests
        run: just test-e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        with:
          name: playwright-report
          path: out/e2e-report/
          retention-days: 7

      - name: Ensure libs importable
        env:
          SKIP_RUN: "1"
        run: ./run

      - name: Check Rust dependencies
        if: github.event_name == 'pull_request'
        id: rust-deps
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 #v47.0.6
        with:
          files: |
            Cargo.lock
            **/Cargo.toml
            .deny.toml

      - name: Run cargo-deny check
        if: github.event_name != 'pull_request' || steps.rust-deps.outputs.any_changed == 'true'
        shell: bash
        run: cargo deny check

      - name: Save node_modules cache
        if: always() && steps.node-modules-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 #v6.1.0
        with:
          path: out/node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('yarn.lock') }}

      - name: Save build output cache
        if: always()
        uses: ./.github/actions/save-build-cache
        with:
          cache-prefix: build-Linux-${{ github.event.pull_request.number || 'main' }}

  # ARM Linux. Runs on pushes to release branches, manual dispatch, or on PRs
  # with the check:linux label (not on every push to main).
  check-linux-arm:
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/'))
      || github.event_name == 'workflow_dispatch'
      || contains(github.event.pull_request.labels.*.name, 'check:linux')
    runs-on: ubuntu-24.04-arm
    name: check (linux-arm)
    permissions:
      contents: read
      actions: write # cache pruning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v4

      - name: Restore cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 #v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cargo/bin
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: cargo-arm64-Linux-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-arm64-Linux-

      - name: Restore build output cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 #v6.1.0
        with:
          path: out
          key: build-arm64-Linux-${{ github.event.pull_request.number || 'main' }}-${{ github.run_id }}
          restore-keys: |
            build-arm64-Linux-${{ github.event.pull_request.number || 'main' }}-
            build-arm64-Linux-main-
            build-arm64-Linux-

      - name: Restore node_modules cache
        id: node-modules-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 #v6.1.0
        with:
          path: out/node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('yarn.lock') }}
          restore-keys: node-modules-${{ runner.os }}-${{ runner.arch }}-

      - name: Setup build environment
        uses: ./.github/actions/setup-anki

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 #v4

      - name: Install cargo-llvm-cov and cargo-nextest
        uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68 #v2.85.3
        with:
          tool: |
            cargo-llvm-cov@0.8.4
            cargo-nextest@0.9.99

      - name: Symlink node_modules
        run: ln -sf out/node_modules .

      - name: Build
        run: just build

      - name: Lint and test
        run: |
          just lint
          just test

      - name: Save node_modules cache
        if: always() && steps.node-modules-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 #v6.1.0
        with:
          path: out/node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('yarn.lock') }}

      # PR-labeled runs restore from the main entry but do not save; per-PR
      # platform caches would blow the 10 GB budget.
      - name: Save build output cache
        if: always() && github.event_name != 'pull_request'
        uses: ./.github/actions/save-build-cache
        with:
          cache-prefix: build-arm64-Linux-${{ github.event.pull_request.number || 'main' }}

  # Intel Mac. Runs on pushes to release branches, manual dispatch, or on PRs
  # with the check:macos label (not on every push to main).
  check-macos-intel:
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/'))
      || github.event_name == 'workflow_dispatch'
      || contains(github.event.pull_request.labels.*.name, 'check:macos')
    runs-on: macos-15-intel
    name: check (macos-intel)
    permissions:
      contents: read
      actions: write # cache pruning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v4
        with:
          submodules: true

      - name: Restore cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 #v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cargo/bin
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: cargo-intel-macOS-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-intel-macOS-

      - name: Restore build output cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 #v6.1.0
        with:
          path: out
          key: build-intel-macOS-${{ github.event.pull_request.number || 'main' }}-${{ github.run_id }}
          restore-keys: |
            build-intel-macOS-${{ github.event.pull_request.number || 'main' }}-
            build-intel-macOS-main-
            build-intel-macOS-

      - name: Restore node_modules cache
        id: node-modules-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 #v6.1.0
        with:
          path: out/node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('yarn.lock') }}
          restore-keys: node-modules-${{ runner.os }}-${{ runner.arch }}-

      - name: Setup build environment
        uses: ./.github/actions/setup-anki

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 #v4

      - name: Install cargo-llvm-cov and cargo-nextest
        uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68 #v2.85.3
        with:
          tool: |
            cargo-llvm-cov@0.8.4
            cargo-nextest@0.9.99

      - name: Symlink node_modules
        run: ln -sf out/node_modules .

      - name: Build
        run: just build

      - name: Lint and test
        run: |
          just lint
          just test

      - name: Save node_modules cache
        if: always() && steps.node-modules-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 #v6.1.0
        with:
          path: out/node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('yarn.lock') }}

      # PR-labeled runs restore from the main entry but do not save; per-PR
      # platform caches would blow the 10 GB budget.
      - name: Save build output cache
        if: always() && github.event_name != 'pull_request'
        uses: ./.github/actions/save-build-cache
        with:
          cache-prefix: build-intel-macOS-${{ github.event.pull_request.number || 'main' }}

  # Runs on pushes to main or on PRs with the check:macos label.
  check-macos:
    if: >-
      github.event_name == 'push'
      || github.event_name == 'workflow_dispatch'
      || contains(github.event.pull_request.labels.*.name, 'check:macos')
    runs-on: macos-latest
    name: check (macos)
    permissions:
      contents: read
      actions: write # cache pruning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v4
        with:
          submodules: true

      - name: Restore cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 #v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cargo/bin
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: cargo-macOS-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-macOS-

      - name: Restore build output cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 #v6.1.0
        with:
          path: out
          key: build-macOS-${{ github.event.pull_request.number || 'main' }}-${{ github.run_id }}
          restore-keys: |
            build-macOS-${{ github.event.pull_request.number || 'main' }}-
            build-macOS-main-
            build-macOS-

      - name: Restore node_modules cache
        id: node-modules-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 #v6.1.0
        with:
          path: out/node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('yarn.lock') }}
          restore-keys: node-modules-${{ runner.os }}-${{ runner.arch }}-

      - name: Setup build environment
        uses: ./.github/actions/setup-anki

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 #v4

      - name: Install cargo-llvm-cov and cargo-nextest
        uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68 #v2.85.3
        with:
          tool: |
            cargo-llvm-cov@0.8.4
            cargo-nextest@0.9.99

      - name: Symlink node_modules
        run: ln -sf out/node_modules .

      - name: Build
        run: just build

      - name: Lint and test
        run: |
          just lint
          just test

      - name: Save node_modules cache
        if: always() && steps.node-modules-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 #v6.1.0
        with:
          path: out/node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('yarn.lock') }}

      # PR-labeled runs restore from the main entry but do not save; per-PR
      # platform caches would blow the 10 GB budget.
      - name: Save build output cache
        if: always() && github.event_name != 'pull_request'
        uses: ./.github/actions/save-build-cache
        with:
          cache-prefix: build-macOS-${{ github.event.pull_request.number || 'main' }}

  # Runs on pushes to main or on PRs with the check:windows label.
  check-windows:
    if: >-
      github.event_name == 'push'
      || github.event_name == 'workflow_dispatch'
      || contains(github.event.pull_request.labels.*.name, 'check:windows')
    runs-on: windows-latest
    name: check (windows)
    permissions:
      contents: read
      actions: write # cache pruning
    # Colocate CARGO_HOME and TEMP on D: to keep all I/O on the same fast
    # local disk.
    env:
      CARGO_HOME: D:\cargo-home
      TEMP: D:\tmp
      TMP: D:\tmp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v4
        with:
          submodules: true

      - name: Prepare D:\ directories
        shell: bash
        run: mkdir -p /d/cargo-home /d/tmp

      - name: Restore cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 #v6.1.0
        with:
          path: |
            D:\cargo-home\registry\index
            D:\cargo-home\registry\cache
            D:\cargo-home\git\db
            D:\cargo-home\bin
            D:\cargo-home\.crates.toml
            D:\cargo-home\.crates2.json
          key: cargo-Windows-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-Windows-

      - name: Restore build output cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 #v6.1.0
        with:
          path: out
          key: build-Windows-${{ github.event.pull_request.number || 'main' }}-${{ github.run_id }}
          restore-keys: |
            build-Windows-${{ github.event.pull_request.number || 'main' }}-
            build-Windows-main-
            build-Windows-

      # On Windows the real node_modules directory lives at the repo root;
      # out/node_modules is a junction to it (see build/runner/src/yarn.rs).
      - name: Restore node_modules cache
        id: node-modules-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 #v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('yarn.lock') }}
          restore-keys: node-modules-${{ runner.os }}-${{ runner.arch }}-

      # The build runner only creates the junction when the root directory is
      # missing (build/runner/src/yarn.rs), so create it here after a restore.
      - name: Link node_modules junction
        if: steps.node-modules-cache.outputs.cache-matched-key != ''
        shell: bash
        run: |
          mkdir -p out
          rm -rf out/node_modules
          cmd //c "mklink /J out\\node_modules node_modules"

      - name: Setup build environment
        uses: ./.github/actions/setup-anki

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 #v4

      - name: Install cargo-llvm-cov and cargo-nextest
        uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68 #v2.85.3
        with:
          tool: |
            cargo-llvm-cov@0.8.4
            cargo-nextest@0.9.99

      - name: Build
        run: just build

      - name: Lint and test
        run: |
          just lint
          just test

      - name: Save node_modules cache
        if: always() && steps.node-modules-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 #v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('yarn.lock') }}

      # PR-labeled runs restore from the main entry but do not save; per-PR
      # platform caches would blow the 10 GB budget.
      - name: Save build output cache
        if: always() && github.event_name != 'pull_request'
        uses: ./.github/actions/save-build-cache
        with:
          cache-prefix: build-Windows-${{ github.event.pull_request.number || 'main' }}

  # ARM Windows. Runs on pushes to release branches, manual dispatch, or on
  # PRs with the check:windows label (not on every push to main).
  check-windows-arm:
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/'))
      || github.event_name == 'workflow_dispatch'
      || contains(github.event.pull_request.labels.*.name, 'check:windows')
    runs-on: windows-11-arm
    name: check (windows-arm)
    permissions:
      contents: read
      actions: write # cache pruning
    # Unlike the x64 Windows runner, windows-11-arm has no D: drive, so we use
    # the default C:-based CARGO_HOME and TEMP.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v4
        with:
          submodules: true

      - name: Restore cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 #v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cargo/bin
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: cargo-arm64-Windows-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-arm64-Windows-

      - name: Restore build output cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 #v6.1.0
        with:
          path: out
          key: build-arm64-Windows-${{ github.event.pull_request.number || 'main' }}-${{ github.run_id }}
          restore-keys: |
            build-arm64-Windows-${{ github.event.pull_request.number || 'main' }}-
            build-arm64-Windows-main-
            build-arm64-Windows-

      # On Windows the real node_modules directory lives at the repo root;
      # out/node_modules is a junction to it (see build/runner/src/yarn.rs).
      - name: Restore node_modules cache
        id: node-modules-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 #v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('yarn.lock') }}
          restore-keys: node-modules-${{ runner.os }}-${{ runner.arch }}-

      # The build runner only creates the junction when the root directory is
      # missing (build/runner/src/yarn.rs), so create it here after a restore.
      - name: Link node_modules junction
        if: steps.node-modules-cache.outputs.cache-matched-key != ''
        shell: bash
        run: |
          mkdir -p out
          rm -rf out/node_modules
          cmd //c "mklink /J out\\node_modules node_modules"

      - name: Setup build environment
        uses: ./.github/actions/setup-anki

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 #v4

      - name: Install cargo-llvm-cov and cargo-nextest
        uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68 #v2.85.3
        with:
          tool: |
            cargo-llvm-cov@0.8.4
            cargo-nextest@0.9.99

      - name: Build
        run: just build

      - name: Lint and test
        run: |
          just lint
          just test

      - name: Save node_modules cache
        if: always() && steps.node-modules-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 #v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('yarn.lock') }}

      # PR-labeled runs restore from the main entry but do not save; per-PR
      # platform caches would blow the 10 GB budget.
      - name: Save build output cache
        if: always() && github.event_name != 'pull_request'
        uses: ./.github/actions/save-build-cache
        with:
          cache-prefix: build-arm64-Windows-${{ github.event.pull_request.number || 'main' }}
