name: SonarCloud

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

jobs:
  sonar:
    name: SonarCloud Scan
    runs-on: ubuntu-24.04
    if: github.event.workflow_run.conclusion != 'cancelled'
    steps:
      # Checkout the PR/push code so SonarCloud analyses the actual changes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v4
        with:
          repository: ${{ github.event.workflow_run.head_repository.full_name }}
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      # Overwrite sonar-project.properties with the trusted version from the
      # default branch so a fork PR cannot redirect sonar.host.url to steal
      # the token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v4
        with:
          sparse-checkout: sonar-project.properties
          sparse-checkout-cone-mode: false
          path: .sonar-trusted

      - run: cp .sonar-trusted/sonar-project.properties sonar-project.properties

      - name: Download coverage reports
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 #v4.3.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          name: coverage-reports
          path: out

      # Read the PR context saved by ci.yml. For push events the files are
      # absent; outputs will be empty and the scan runs as a branch analysis.
      - name: Read PR context
        id: pr
        run: |
          if [ -f out/sonar/pr-number.txt ]; then
            echo "number=$(cat out/sonar/pr-number.txt)"   >> "$GITHUB_OUTPUT"
            echo "head_ref=$(cat out/sonar/pr-head-ref.txt)" >> "$GITHUB_OUTPUT"
            echo "base_ref=$(cat out/sonar/pr-base-ref.txt)" >> "$GITHUB_OUTPUT"
          fi

      - name: SonarCloud Scan
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@713881670b6b3676cda39549040e2d88c70d582e #v8.2.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_SCANNER_OPTS: >-
            -Dsonar.scm.revision=${{ github.event.workflow_run.head_sha }}
            ${{ steps.pr.outputs.number != '' &&
               format('-Dsonar.pullrequest.key={0} -Dsonar.pullrequest.branch={1} -Dsonar.pullrequest.base={2}',
                      steps.pr.outputs.number,
                      steps.pr.outputs.head_ref,
                      steps.pr.outputs.base_ref) || '' }}
