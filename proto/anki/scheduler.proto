    FSRS = 0;
    RWKV = 1;
  }
  enum PerformanceScenario {
    STEADY = 0;
    TEMPORARY_DROP = 1;
    PERSISTENT_DROP = 2;
    TEMPORARY_IMPROVEMENT = 3;
  }
  Learner learner = 1;
  PerformanceScenario scenario = 2;
  uint32 repetitions = 3;
  // Also simulate the other learner using the same prepared inputs.
  bool compare_both_learners = 4;
}

