name: Save Build Cache
description: >
  Report out/ sizes, remove non-cacheable state, save the build output cache,
  and delete the cache entries that the new save supersedes.

inputs:
  cache-prefix:
    description: Cache key prefix without the run id (e.g. build-Linux-main)
    required: true
  github-token:
    description: Token with actions:write scope, used to prune superseded caches
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    # Keeps cache-size regressions diagnosable from the logs.
    - name: Report out/ sizes
      shell: bash
      run: du -sh out/* out/rust/* 2>/dev/null | sort -h | tail -15 || true

    # out/pyenv contains a venv with absolute Python paths that break across
    # runs. out/build.ninja is regenerated by configure each time.
    # node_modules is cached separately, keyed on yarn.lock (real directory at
    # the repo root on Windows, under out/ elsewhere). out/rust/tmp and
    # out/e2e-report only inflate the cache.
    - name: Clean non-cacheable state
      shell: bash
      run: |
        rm -rf out/pyenv node_modules out/node_modules out/rust/tmp out/e2e-report
        rm -f out/build.ninja

    - name: Save build output cache
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 #v6.1.0
      with:
        path: out
        key: ${{ inputs.cache-prefix }}-${{ github.run_id }}

    # Cache entries are immutable, so every run saves a new ~1 GB entry.
    # Delete the entries this save supersedes to stay inside the 10 GB
    # repository budget. Fork PRs have a read-only token, so this step can
    # fail there; cache-cleanup.yml removes their entries when the PR closes.
    - name: Prune superseded caches
      shell: bash
      continue-on-error: true
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PREFIX: ${{ inputs.cache-prefix }}-
        CURRENT_KEY: ${{ inputs.cache-prefix }}-${{ github.run_id }}
      run: |
        gh api "repos/${{ github.repository }}/actions/caches?key=$PREFIX&per_page=100" \
          --jq '.actions_caches[] | select(.key != env.CURRENT_KEY) | .id' |
          while read -r id; do
            gh api -X DELETE "repos/${{ github.repository }}/actions/caches/$id" || true
          done
