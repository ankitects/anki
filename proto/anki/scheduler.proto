syntax = "proto3";

package anki.scheduler;

import "anki/cards.proto";
import "anki/collection.proto";
import "anki/config.proto";
import "anki/deck_config.proto";
import "anki/decks.proto";
import "anki/generic.proto";

option java_multiple_files = true;

service SchedulerService {
  rpc GetQueuedCards(GetQueuedCardsRequest) returns (QueuedCards);
  // Rebuilds and retains the queue while treating the supplied card as already
  // displayed, and returns the resulting counts without fetching another card.
  rpc RebuildQueuedCardsPreservingCurrentCard(cards.CardId)
      returns (QueuedCards);
  rpc AnswerCard(CardAnswer) returns (collection.OpChanges);
  rpc SchedTimingToday(generic.Empty) returns (SchedTimingTodayResponse);
  rpc StudiedToday(generic.Empty) returns (generic.String);
  rpc StudiedTodayMessage(StudiedTodayMessageRequest) returns (generic.String);
  rpc UpdateStats(UpdateStatsRequest) returns (generic.Empty);
  rpc ExtendLimits(ExtendLimitsRequest) returns (generic.Empty);
  rpc CountsForDeckToday(decks.DeckId) returns (CountsForDeckTodayResponse);
  // kuma3: the cards a deck's study queue would show today, built without
  // selecting the deck (no "Select Deck" undo step, Undo kept).
  rpc GetDeckQueue(decks.DeckId) returns (DeckQueue);
  rpc CongratsInfo(generic.Empty) returns (CongratsInfoResponse);
  rpc RestoreBuriedAndSuspendedCards(cards.CardIds) returns (collection.OpChanges);
  rpc UnburyDeck(UnburyDeckRequest) returns (collection.OpChanges);
  rpc BuryOrSuspendCards(BuryOrSuspendCardsRequest) returns (collection.OpChangesWithCount);
  rpc EmptyFilteredDeck(decks.DeckId) returns (collection.OpChanges);
  rpc RebuildFilteredDeck(decks.DeckId) returns (collection.OpChangesWithCount);
  rpc ScheduleCardsAsNew(ScheduleCardsAsNewRequest) returns (collection.OpChanges);
  rpc ScheduleCardsAsNewDefaults(ScheduleCardsAsNewDefaultsRequest) returns (ScheduleCardsAsNewDefaultsResponse);
  rpc SetDueDate(SetDueDateRequest) returns (collection.OpChanges);
  rpc GradeNow(GradeNowRequest) returns (collection.OpChanges);
  rpc SortCards(SortCardsRequest) returns (collection.OpChangesWithCount);
  rpc SortDeck(SortDeckRequest) returns (collection.OpChangesWithCount);
  rpc GetSchedulingStates(cards.CardId) returns (SchedulingStates);
  rpc GetSchedulingStatesWithOpts(GetSchedulingStatesRequest)
      returns (SchedulingStates);
  rpc DescribeNextStates(SchedulingStates) returns (generic.StringList);
  rpc StateIsLeech(SchedulingState) returns (generic.Bool);
  rpc UpgradeScheduler(generic.Empty) returns (generic.Empty);
  rpc CustomStudy(CustomStudyRequest) returns (collection.OpChanges);
  rpc CustomStudyDefaults(CustomStudyDefaultsRequest) returns (CustomStudyDefaultsResponse);
  rpc RepositionDefaults(generic.Empty) returns (RepositionDefaultsResponse);
  rpc ComputeFsrsParams(ComputeFsrsParamsRequest)
      returns (ComputeFsrsParamsResponse);
  rpc ComputeFsrsParamsBatch(ComputeFsrsParamsBatchRequest)
      returns (ComputeFsrsParamsBatchResponse);
  rpc GetOptimalRetentionParameters(GetOptimalRetentionParametersRequest)
      returns (GetOptimalRetentionParametersResponse);
  rpc ComputeOptimalRetention(SimulateFsrsReviewRequest)
      returns (ComputeOptimalRetentionResponse);
  rpc SimulateFsrsReview(SimulateFsrsReviewRequest)
      returns (SimulateFsrsReviewResponse);
  rpc SimulateFsrsWorkload(SimulateFsrsReviewRequest)
      returns (SimulateFsrsWorkloadResponse);
  rpc GetFsrsNewCardIntervals(GetFsrsNewCardIntervalsRequest)
      returns (generic.StringList);
  rpc EvaluateParams(EvaluateParamsRequest) returns (EvaluateParamsResponse);
  rpc EvaluateParamsLegacy(EvaluateParamsLegacyRequest) returns (EvaluateParamsResponse);
  rpc ComputeMemoryState(cards.CardId) returns (ComputeMemoryStateResponse);
  rpc GetFsrsPresetForCard(cards.CardId) returns (FsrsPresetForCardResponse);
  // The number of days the calculated interval was fuzzed by on the previous
  // review (if any). Utilized by the FSRS add-on.
  rpc FuzzDelta(FuzzDeltaRequest) returns (FuzzDeltaResponse);
  // Build answer states after replacing any supplied intervals with
  // unrounded day values from an external scheduler such as RWKV-Curve.
  rpc SchedulingStatesWithIntervals(SchedulingStatesWithIntervalsRequest)
      returns (SchedulingStates);
  // Helper APIs for add-ons that need scheduler-accurate FSRS math.
  rpc FsrsCurrentRetrievability(FsrsCurrentRetrievabilityRequest)
      returns (FsrsCurrentRetrievabilityResponse);
  rpc FsrsNextInterval(FsrsNextIntervalRequest)
      returns (FsrsNextIntervalResponse);
  rpc FsrsIntervalAtRetrievability(FsrsIntervalAtRetrievabilityRequest)
      returns (FsrsIntervalAtRetrievabilityResponse);
  rpc FsrsIntervalAtRetrievabilityBatch(
      FsrsIntervalAtRetrievabilityBatchRequest)
      returns (FsrsIntervalAtRetrievabilityBatchResponse);
  rpc FsrsIntervalAtRetrievabilityVariableBatch(
      FsrsIntervalAtRetrievabilityVariableBatchRequest)
      returns (FsrsIntervalAtRetrievabilityVariableBatchResponse);
  rpc FsrsDesiredRetentionForIntervalsBatch(
      FsrsDesiredRetentionForIntervalsBatchRequest)
      returns (FsrsDesiredRetentionForIntervalsBatchResponse);
  rpc FsrsIntervalAtRetrievabilityByConfigBatch(
      FsrsIntervalAtRetrievabilityByConfigBatchRequest)
      returns (FsrsIntervalAtRetrievabilityByConfigBatchResponse);
  // Installs a transient desktop-only RWKV retrievability map used by review
  // queue ordering. Empty scores clear the map.
  rpc SetRwkvReviewQueueScores(RwkvReviewQueueScoresRequest)
      returns (generic.Empty);
  // Updates or removes one already-answered card's transient queue score
  // without invalidating the retained queue behind it.
  rpc PatchAnsweredCardRwkvReviewQueueScore(
      RwkvAnsweredCardQueueScorePatchRequest) returns (generic.Empty);
  // Incrementally installs transient desktop-only RWKV score maps used only
  // while rendering deck-browser counts. Each request replaces one disjoint
  // deck scope; ClearRwkvDeckCountScores removes every scope.
  rpc SetRwkvDeckCountScores(RwkvReviewQueueScoresRequest)
      returns (generic.Empty);
  rpc ClearRwkvDeckCountScores(generic.Empty) returns (generic.Empty);
  // Updates session-local repeat-spacing metadata on the active transient RWKV
  // review queue map without replacing retrievability scores.
  rpc UpdateRwkvReviewQueueInterveningReviews(
      RwkvReviewQueueInterveningReviewsRequest) returns (generic.Empty);
  // Installs a transient desktop-only RWKV retrievability map used by stats
  // graphs. Scores are scoped to the supplied search.
  rpc SetRwkvStatsGraphScores(RwkvStatsGraphScoresRequest)
      returns (generic.Empty);
  // Installs or clears a transient desktop-only RWKV retrievability score
  // computed while rendering card info.
  rpc SetRwkvCardInfoScore(RwkvCardInfoScoreRequest) returns (generic.Empty);
  // Returns the active transient desktop-only RWKV retrievability score for a
  // card, if one has been installed for the current scheduler day.
  rpc GetRwkvRetrievabilityScore(cards.CardId)
      returns (RwkvRetrievabilityScoreResponse);
  // Stores derived local RWKV review-time retrievability cache rows.
  rpc SetRwkvReviewRetrievabilityCacheRows(
      RwkvReviewRetrievabilityCacheRowsRequest) returns (generic.UInt32);
  // Clears both local derived historical prediction tables without changing
  // reviews.
  rpc ClearReviewRetrievabilityCache(generic.Empty) returns (generic.Empty);
  // Applies desktop-computed RWKV reschedule intervals and S90 values.
  rpc ApplyRwkvReviewReschedule(RwkvReviewRescheduleRequest)
      returns (collection.OpChangesWithCount);
  rpc RwkvReviewInputRowsForCards(RwkvReviewInputRowsForCardsRequest)
      returns (RwkvReviewInputRowsForCardsResponse);
  rpc RwkvReviewInputRowsForSearch(RwkvReviewInputRowsForSearchRequest)
      returns (RwkvReviewInputRowsForCardsResponse);
  rpc RwkvReviewInputRowsForDeckReviewQueue(
      RwkvReviewInputRowsForDeckReviewQueueRequest)
      returns (RwkvReviewInputRowsForCardsResponse);
  rpc GetFsrsPresetIdsForCards(cards.CardIds)
      returns (FsrsPresetIdsForCardsResponse);
  // Computes the canonical RWKV history identity inside the collection
  // backend, avoiding a full revlog transfer through Python when validating a
  // persisted state cache.
  rpc RwkvHistoricalReviewFingerprint(RwkvHistoricalReviewFingerprintRequest)
      returns (RwkvHistoricalReviewFingerprintResponse);
  rpc RwkvHistoricalReviewInputs(RwkvHistoricalReviewInputsRequest)
      returns (RwkvHistoricalReviewInputsResponse);
  // RWKV-Instant for clients without the desktop's Python: loads the model,
  // replays the review history, and from then on installs the transient score
  // maps inside the backend. Cheap to call again when nothing changed.
  rpc RwkvPrepareOffline(RwkvPrepareOfflineRequest)
      returns (RwkvPrepareOfflineResponse);
  // Rescores every Instant-enabled deck and installs the deck count scores.
  rpc RwkvOfflineInstantPassStep(RwkvOfflineInstantPassStepRequest)
      returns (RwkvOfflineInstantPassProgress);
  // Projected recall of review cards at later times, "if you stop reviewing
  // now" (kuma3's version of the desktop rwkv_forecast add-on).
  rpc RwkvOfflineForecast(RwkvOfflineForecastRequest)
      returns (RwkvOfflineForecastResponse);
  // The recall RWKV predicted just before the given answers (the desktop's
  // calibration data, for kuma3's Search Stats Extended graphs); the first
  // call starts recording it with a full replay in the background.
  rpc RwkvOfflineCalibration(RwkvOfflineCalibrationRequest)
      returns (RwkvOfflineCalibrationResponse);
  // "Reschedule Cards with RWKV-Curve Intervals" for clients without the
  // desktop's Python: the deck's review cards in Curve presets get their
  // current curve's interval and S90 (as ApplyRwkvReviewReschedule).
  rpc RwkvOfflineCurveReschedule(decks.DeckId)
      returns (collection.OpChangesWithCount);
  // Deck Options' RWKV workload simulation and "Compare RWKV with FSRS" for
  // clients without the desktop's Python: started on its own thread (the
  // standard order applies until it is done), then polled.
  rpc RwkvOfflineWorkloadStart(SimulateFsrsReviewRequest)
      returns (generic.Empty);
  rpc RwkvOfflineWorkloadResult(generic.Empty)
      returns (RwkvOfflineWorkloadResultResponse);
  rpc RwkvOfflineWorkloadCancel(generic.Empty) returns (generic.Empty);
  rpc RwkvOfflineWorkloadProgress(generic.Empty)
      returns (collection.ComputeRetentionProgress);
  // False when RWKV-Instant runs its Instant model alone (no RWKV-Curve).
  rpc RwkvOfflineWorkloadAvailable(generic.Empty) returns (generic.Bool);
  // Computes the RWKV answer-time head's history features for cards from the
  // canonical RWKV history (the same traversal as the inputs above).
  rpc RwkvAnswerTimeHistoryFeatures(RwkvAnswerTimeHistoryFeaturesRequest)
      returns (RwkvAnswerTimeHistoryFeaturesResponse);
  // Deletes calibration rows that a completed RWKV calibration recompute
  // superseded.
  rpc PruneRwkvReviewRetrievabilityCacheRows(
      PruneRwkvReviewRetrievabilityCacheRowsRequest) returns (generic.UInt32);
  // Comparison-only predictions. These do not change card or review state.
  rpc FsrsSixCurrentScores(cards.CardIds) returns (Fsrs6CurrentScoresResponse);
  rpc FsrsSixComparisonFingerprint(generic.String) returns (generic.String);
}

// Implicitly includes any of the above methods that are not listed in the
// backend service.
service BackendSchedulerService {
  // Rebuilds historical FSRS predictions and validation folds for every deck
  // preset.
  rpc RebuildFsrsReviewRetrievabilityCache(generic.Empty)
      returns (generic.UInt32);
  // kuma3: the same without the validation folds: each preset's current
  // parameters over the whole history (rows of role final_fit), one pass.
  rpc FsrsCalibrationFinalFit(generic.Empty) returns (generic.UInt32);
  rpc ComputeFsrsReviewRetrievabilityCalibration(
      ComputeFsrsReviewRetrievabilityCalibrationRequest)
      returns (generic.UInt32);
  rpc ComputeFsrsParamsFromItems(ComputeFsrsParamsFromItemsRequest)
      returns (ComputeFsrsParamsResponse);
  // Generates parameters used for FSRS's scheduler benchmarks.
  rpc FsrsBenchmark(FsrsBenchmarkRequest) returns (FsrsBenchmarkResponse);
  // Used for exporting revlogs for algorithm research.
  rpc ExportDataset(ExportDatasetRequest) returns (generic.Empty);
  rpc ComputeFsrsSixComparison(ComputeFsrs6ComparisonRequest)
      returns (ComputeFsrs6ComparisonResponse);
}

message SchedulingState {
  message New {
    uint32 position = 1;
  }
  message Learning {
    uint32 remaining_steps = 1;
    uint32 scheduled_secs = 2;
    uint32 elapsed_secs = 3;
    optional cards.FsrsMemoryState memory_state = 6;
  }
  message Review {
    uint32 scheduled_days = 1;
    uint32 elapsed_days = 2;
    float ease_factor = 3;
    uint32 lapses = 4;
    bool leeched = 5;
    optional cards.FsrsMemoryState memory_state = 6;
    sint32 fuzz_delta_days = 7;
  }
  message Relearning {
    Review review = 1;
    Learning learning = 2;
  }
  message Normal {
    oneof kind {
      New new = 1;
      Learning learning = 2;
      Review review = 3;
      Relearning relearning = 4;
    }
  }
  message Preview {
    uint32 scheduled_secs = 1;
    bool finished = 2;
  }
  message ReschedulingFilter {
    Normal original_state = 1;
  }
  message Filtered {
    oneof kind {
      Preview preview = 1;
      ReschedulingFilter rescheduling = 2;
    }
  }

  oneof kind {
    Normal normal = 1;
    Filtered filtered = 2;
  }
  // The backend does not populate this field in GetQueuedCards; the front-end
  // is expected to populate it based on the provided Card. If it's not set when
  // answering a card, the existing custom data will not be updated.
  optional string custom_data = 3;
}

message QueuedCards {
  enum Queue {
    NEW = 0;
    LEARNING = 1;
    REVIEW = 2;
  }
  message QueuedCard {
    cards.Card card = 1;
    Queue queue = 2;
    SchedulingStates states = 3;
    SchedulingContext context = 4;
  }

  repeated QueuedCard cards = 1;
  uint32 new_count = 2;
  uint32 learning_count = 3;
  uint32 review_count = 4;
}

message DeckQueue {
  repeated int64 card_ids = 1;
  repeated QueuedCards.Queue queues = 2;
}

message GetQueuedCardsRequest {
  uint32 fetch_limit = 1;
  bool intraday_learning_only = 2;
  bool skip_scheduling_states = 3;
}

message GetSchedulingStatesRequest {
  int64 card_id = 1;
  optional float desired_retention_override = 2;
}

message SchedTimingTodayResponse {
  uint32 days_elapsed = 1;
  int64 next_day_at = 2;
}

message StudiedTodayMessageRequest {
  uint32 cards = 1;
  double seconds = 2;
}

message UpdateStatsRequest {
  int64 deck_id = 1;
  int32 new_delta = 2;
  int32 review_delta = 4;
  int32 millisecond_delta = 5;
}

message ExtendLimitsRequest {
  int64 deck_id = 1;
  int32 new_delta = 2;
  int32 review_delta = 3;
}

message CountsForDeckTodayResponse {
  int32 new = 1;
  int32 review = 2;
}

message CongratsInfoResponse {
  uint32 learn_remaining = 1;
  uint32 secs_until_next_learn = 2;
  bool review_remaining = 3;
  bool new_remaining = 4;
  bool have_sched_buried = 5;
  bool have_user_buried = 6;
  bool is_filtered_deck = 7;
  bool bridge_commands_supported = 8;
  string deck_description = 9;
}

message UnburyDeckRequest {
  enum Mode {
    ALL = 0;
    SCHED_ONLY = 1;
    USER_ONLY = 2;
  }
  int64 deck_id = 1;
  Mode mode = 2;
}

message BuryOrSuspendCardsRequest {
  enum Mode {
    SUSPEND = 0;
    BURY_SCHED = 1;
    BURY_USER = 2;
  }
  repeated int64 card_ids = 1;
  repeated int64 note_ids = 2;
  Mode mode = 3;
}

message ScheduleCardsAsNewRequest {
  enum Context {
    BROWSER = 0;
    REVIEWER = 1;
  }
  repeated int64 card_ids = 1;
  bool log = 2;
  bool restore_position = 3;
  bool reset_counts = 4;
  optional Context context = 5;
}

message ScheduleCardsAsNewDefaultsRequest {
  ScheduleCardsAsNewRequest.Context context = 1;
}

message ScheduleCardsAsNewDefaultsResponse {
  bool restore_position = 1;
  bool reset_counts = 2;
}

message SetDueDateRequest {
  repeated int64 card_ids = 1;
  string days = 2;
  config.OptionalStringConfigKey config_key = 3;
}

message GradeNowRequest {
  message CardOptions {
    int64 card_id = 1;
    optional float desired_retention_override = 2;
    optional SchedulingStates scheduling_states = 3;
  }

  repeated int64 card_ids = 1;
  CardAnswer.Rating rating = 2;
  repeated CardOptions card_options = 3;
}

message SortCardsRequest {
  repeated int64 card_ids = 1;
  uint32 starting_from = 2;
  uint32 step_size = 3;
  bool randomize = 4;
  bool shift_existing = 5;
}

message SortDeckRequest {
  int64 deck_id = 1;
  bool randomize = 2;
}

message SchedulingStates {
  SchedulingState current = 1;
  SchedulingState again = 2;
  SchedulingState hard = 3;
  SchedulingState good = 4;
  SchedulingState easy = 5;
  repeated float dynamic_desired_retentions = 6;
  bool dynamic_desired_retention_enabled = 7;
}

message CardAnswer {
  enum Rating {
    AGAIN = 0;
    HARD = 1;
    GOOD = 2;
    EASY = 3;
  }

  int64 card_id = 1;
  SchedulingState current_state = 2;
  SchedulingState new_state = 3;
  Rating rating = 4;
  int64 answered_at_millis = 5;
  uint32 milliseconds_taken = 6;
  optional float desired_retention_override = 7;
  optional float rwkv_s90 = 8;
  optional float rwkv_retrievability = 9;
  // Raw revlog kind selected by RWKV's synthetic same-day state machine.
  // Only Learning through Filtered (0-3) are accepted by the backend.
  optional uint32 rwkv_review_kind = 10;
  // The override is the final target selected for this answer, not a base
  // target to be mapped by native Dynamic DR. Requires a valid override.
  bool desired_retention_override_is_final = 11;
}

message CustomStudyRequest {
  message Cram {
    enum CramKind {
      // due cards in due order
      CRAM_KIND_DUE = 0;
      // new cards in added order
      CRAM_KIND_NEW = 1;
      // review cards in random order
      CRAM_KIND_REVIEW = 2;
      // all cards in random order; no rescheduling
      CRAM_KIND_ALL = 3;
    }
    CramKind kind = 1;
    // the maximum number of cards
    uint32 card_limit = 2;
    // cards must match one of these, if unempty
    repeated string tags_to_include = 3;
    // cards must not match any of these
    repeated string tags_to_exclude = 4;
  }
  int64 deck_id = 1;
  oneof value {
    // increase new limit by x
    int32 new_limit_delta = 2;
    // increase review limit by x
    int32 review_limit_delta = 3;
    // repeat cards forgotten in the last x days
    uint32 forgot_days = 4;
    // review cards due in the next x days
    uint32 review_ahead_days = 5;
    // preview new cards added in the last x days
    uint32 preview_days = 6;
    Cram cram = 7;
  }
}

message SchedulingContext {
  string deck_name = 1;
  uint64 seed = 2;
  optional float decay = 3;
  optional float desired_retention = 4;
}

message CustomStudyDefaultsRequest {
  int64 deck_id = 1;
}

message CustomStudyDefaultsResponse {
  message Tag {
    string name = 1;
    bool include = 2;
    bool exclude = 3;
  }

  repeated Tag tags = 1;
  uint32 extend_new = 2;
  uint32 extend_review = 3;
  uint32 available_new = 4;
  uint32 available_review = 5;
  // in v3, counts for children are provided separately
  uint32 available_new_in_children = 6;
  uint32 available_review_in_children = 7;
}

message RepositionDefaultsResponse {
  bool random = 1;
  bool shift = 2;
}

message ComputeFsrsParamsRequest {
  /// The search used to gather cards for training
  string search = 1;
  repeated float current_params = 2;
  int64 ignore_revlogs_before_ms = 3;
  uint32 num_of_relearning_steps = 4;
  bool health_check = 5;
  optional bool include_same_day_reviews = 6;
  optional deck_config.DeckConfig.Config.FsrsVersion fsrs_version = 7;
  bool dynamic_desired_retention_enabled = 8;
  optional uint32 dynamic_desired_retention_review_limit = 9;
  optional float dynamic_desired_retention_max_cost_perday_minutes = 10;
  optional bool enable_scheduling_penalties = 11;
}

message ComputeFsrsParamsResponse {
  repeated float params = 1;
  uint32 fsrs_items = 2;
  optional bool health_check_passed = 3;
  repeated float fsrs_dynamic_desired_retention_params = 4;
  repeated float fsrs_dynamic_desired_retention_weights = 5;
  repeated float fsrs_dynamic_desired_retention_avg_drs = 6;
  float fsrs_dynamic_desired_retention_min = 7;
  float fsrs_dynamic_desired_retention_max = 8;
  repeated float fsrs_dynamic_desired_retention_fsrs_eq_weights = 9;
  repeated float fsrs_dynamic_desired_retention_fsrs_eq_drs = 10;
  repeated float fsrs_dynamic_desired_retention_fixed_target_weights = 11;
  repeated float fsrs_dynamic_desired_retention_fixed_target_drs = 12;
}

message ComputeFsrsParamsBatchRequest {
  message Item {
    string id = 1;
    string name = 2;
    /// The search used to gather cards for training
    string search = 3;
    repeated float current_params = 4;
    int64 ignore_revlogs_before_ms = 5;
    uint32 num_of_relearning_steps = 6;
    optional bool include_same_day_reviews = 7;
    optional deck_config.DeckConfig.Config.FsrsVersion fsrs_version = 8;
    bool dynamic_desired_retention_enabled = 9;
    optional uint32 dynamic_desired_retention_review_limit = 10;
    optional float dynamic_desired_retention_max_cost_perday_minutes = 11;
    optional bool enable_scheduling_penalties = 12;
  }

  repeated Item items = 1;
}

message ComputeFsrsParamsBatchResponse {
  message Item {
    string id = 1;
    string name = 2;
    repeated float params = 3;
    uint32 fsrs_items = 4;
    repeated float fsrs_dynamic_desired_retention_params = 5;
    repeated float fsrs_dynamic_desired_retention_weights = 6;
    repeated float fsrs_dynamic_desired_retention_avg_drs = 7;
    float fsrs_dynamic_desired_retention_min = 8;
    float fsrs_dynamic_desired_retention_max = 9;
    repeated float fsrs_dynamic_desired_retention_fsrs_eq_weights = 10;
    repeated float fsrs_dynamic_desired_retention_fsrs_eq_drs = 11;
    repeated float fsrs_dynamic_desired_retention_fixed_target_weights = 12;
    repeated float fsrs_dynamic_desired_retention_fixed_target_drs = 13;
  }

  repeated Item items = 1;
}

message ComputeFsrsReviewRetrievabilityCalibrationRequest {
  /// The search used to gather cards for calibration
  string search = 1;
  repeated float params = 2;
  int64 ignore_revlogs_before_ms = 3;
  uint32 num_of_relearning_steps = 4;
  optional bool include_same_day_reviews = 5;
  optional deck_config.DeckConfig.Config.FsrsVersion fsrs_version = 6;
  bool include_validation_folds = 7;
  optional bool enable_scheduling_penalties = 8;
}

message Fsrs6CurrentScoresResponse {
  message Score {
    int64 card_id = 1;
    float retrievability = 2;
  }
  repeated Score scores = 1;
  uint32 missing_parameters = 2;
}

message ComputeFsrs6ComparisonRequest {
  string search = 1;
  repeated float params = 2;
  int64 ignore_revlogs_before_ms = 3;
  uint32 num_of_relearning_steps = 4;
  bool include_validation_folds = 5;
}

message ComputeFsrs6ComparisonResponse {
  // Packed, sorted pairs of little-endian int64 review ID and float32 R.
  // final_fit uses the supplied parameters; validation_fold uses parameters
  // trained on the preceding fold. Neither result is persisted by Anki.
  bytes final_fit = 1;
  bytes validation_fold = 2;
  // Hash of the history and rollover used for these predictions.
  string history_fingerprint = 3;
}

message ComputeFsrsParamsFromItemsRequest {
  repeated FsrsItem items = 1;
}

message FsrsBenchmarkRequest {
  repeated FsrsItem train_set = 1;
}

message FsrsBenchmarkResponse {
  repeated float params = 1;
}

message ExportDatasetRequest {
  uint32 min_entries = 1;
  string target_path = 2;
}

message FsrsItem {
  repeated FsrsReview reviews = 1;
}

message FsrsReview {
  uint32 rating = 1;
  uint32 delta_t = 2;
}

message SimulateFsrsReviewRequest {
  repeated float params = 1;
  float desired_retention = 2;
  uint32 deck_size = 3;
  uint32 days_to_simulate = 4;
  uint32 new_limit = 5;
  uint32 review_limit = 6;
  uint32 max_interval = 7;
  string search = 8;
  bool new_cards_ignore_review_limit = 9;
  repeated float easy_days_percentages = 10;
  deck_config.DeckConfig.Config.ReviewCardOrder review_order = 11;
  optional uint32 suspend_after_lapse_count = 12;
  float historical_retention = 13;
  uint32 learning_step_count = 14;
  uint32 relearning_step_count = 15;
  optional float review_fuzz_base = 16;
  optional float review_fuzz_factor_short = 17;
  optional float review_fuzz_factor_mid = 18;
  optional float review_fuzz_factor_long = 19;
  optional float help_me_decide_transition_blend_alpha = 21;
  optional bool help_me_decide_enforce_monotonic_success_grade_probs = 22;
  bool simulate_dynamic_desired_retention = 23;
  repeated float fsrs_dynamic_desired_retention_params = 24;
