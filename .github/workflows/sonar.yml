name: SonarCloud

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

# Minimal privileges: read the repo and read artifacts from the triggering
# CI run (download-artifact across runs needs actions: read).
permissions:
  contents: read
  actions: read

# One scan per branch at a time; a newer CI completion cancels an in-flight
# scan of an older commit so SonarCloud always reflects the latest push.
concurrency:
  group: sonar-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  sonar:
    name: SonarCloud Scan
    runs-on: ubuntu-24.04
    # Only run once the whole CI succeeded. This guarantees the coverage and
    # PR-context artifacts were uploaded (their upload steps are gated on
    # success too), so the scan always has coverage and never falls back to a
    # branch analysis with an empty PR context.
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      # Checkout the PR/push code so SonarCloud analyses the actual changes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v4
        with:
          repository: ${{ github.event.workflow_run.head_repository.full_name }}
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      # Overwrite sonar-project.properties with the trusted version from the
      # default branch so a fork PR cannot redirect sonar.host.url to steal
      # the token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v4
        with:
          sparse-checkout: sonar-project.properties
          sparse-checkout-cone-mode: false
          path: .sonar-trusted

      - run: cp .sonar-trusted/sonar-project.properties sonar-project.properties

      - name: Download coverage reports
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 #v4.3.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          name: coverage-reports
          path: out

      # Read the PR context saved by ci.yml. For push events the files are
      # absent; outputs stay empty and the scan runs as a branch analysis.
      # These files were written by ci.yml, which runs in the (untrusted) fork
      # context for fork PRs, so validate/normalise before trusting them: the
      # number must be digits-only, and refs are read one line at a time so a
      # stray newline cannot inject extra $GITHUB_OUTPUT entries.
      - name: Read PR context
        id: pr
        run: |
          if [ -f out/sonar/pr-number.txt ]; then
            num=$(head -n1 out/sonar/pr-number.txt)
            if [[ "$num" =~ ^[0-9]+$ ]]; then
              echo "number=$num"                              >> "$GITHUB_OUTPUT"
              echo "head_ref=$(head -n1 out/sonar/pr-head-ref.txt)" >> "$GITHUB_OUTPUT"
              echo "base_ref=$(head -n1 out/sonar/pr-base-ref.txt)" >> "$GITHUB_OUTPUT"
            else
              echo "pr-number '$num' is not numeric; running as branch analysis"
            fi
          fi

      - name: SonarCloud Scan
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@713881670b6b3676cda39549040e2d88c70d582e #v8.2.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_SCANNER_OPTS: >-
            -Dsonar.scm.revision=${{ github.event.workflow_run.head_sha }}
            ${{ steps.pr.outputs.number != '' &&
               format('-Dsonar.pullrequest.key={0} -Dsonar.pullrequest.branch={1} -Dsonar.pullrequest.base={2}',
                      steps.pr.outputs.number,
                      steps.pr.outputs.head_ref,
                      steps.pr.outputs.base_ref) || '' }}
